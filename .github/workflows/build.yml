name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Restore personal signing key
        env:
          KEYSTORE_B64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/personal.p12"
            echo "GLASSOS_DEBUG_KEYSTORE=$RUNNER_TEMP/personal.p12" >> "$GITHUB_ENV"
          fi
      - name: Run JVM checks, build debug APK and check lint
        env:
          GLASSOS_DEBUG_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
        run: bash build-personal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: glassos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

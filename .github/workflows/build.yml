name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Restore personal signing key
        env:
          KEYSTORE_B64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/personal.p12"
            echo "GLASSOS_DEBUG_KEYSTORE=$RUNNER_TEMP/personal.p12" >> "$GITHUB_ENV"
            # From here on a build signed with any other key fails instead of producing an APK the TV rejects.
            echo "GLASSOS_REQUIRE_PERSONAL_KEY=true" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pull requests from forks cannot read secrets; their APK is for CI only, never for the TV.
            echo "::warning::Personal signing key unavailable; this APK is signed with a throwaway key and cannot update the TV."
          else
            echo "::error::PERSONAL_KEYSTORE_BASE64 / PERSONAL_KEYSTORE_PASSWORD are not set. Refusing to build an APK the TV would reject."
            exit 1
          fi
      - name: Run JVM checks, build debug APK and check lint
        env:
          GLASSOS_DEBUG_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
        run: bash build-personal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: glassos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
